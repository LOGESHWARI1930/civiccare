<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Complaints – CivicCare</title>
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <meta name="theme-color" content="#176B87">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CivicCare">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- CivicCare Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Skeleton Pulse Animation */
    .skeleton {
      background: linear-gradient(90deg, #E2E8F0 25%, #F1F5F9 50%, #E2E8F0 75%);
      background-size: 200% 100%;
      animation: skeleton-pulse 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Filter Status Pills */
    .status-pill-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: #475569;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .status-pill-btn:hover, .status-pill-btn.active {
      background: #176B87;
      color: #FFFFFF;
      border-color: #176B87;
    }

    .complaint-card {
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      background: #FFFFFF;
      transition: all 0.2s ease;
      height: 100%;
    }
    .complaint-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(23, 107, 135, 0.08);
      border-color: #64CCC5;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header / Navbar -->
  <div id="navbar-container"></div>

  <div class="app-container">
    <!-- Desktop Sidebar & Mobile Navigation -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Title Bar -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
          <h2 class="fw-extrabold mb-1">My Complaints</h2>
          <p class="text-muted mb-0">Search, filter, and track all your reported grievances</p>
        </div>
        <div>
          <a href="/citizen/report" class="btn btn-civic-primary fw-semibold shadow-sm">
            <i class="bi bi-plus-circle-fill me-2"></i>Report New Issue
          </a>
        </div>
      </div>

      <!-- Search & Filters Toolbar -->
      <div class="card-civic mb-4">
        <div class="card-body p-3">
          
          <div class="row g-3 align-items-center mb-3">
            <!-- Search Input -->
            <div class="col-lg-5 col-md-6">
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                <input type="text" id="search-input" class="form-control border-start-0" placeholder="Search by complaint number or title..." onkeyup="handleSearchKeyup(event)">
                <button class="btn btn-primary px-3" type="button" onclick="triggerFilterFetch()">Search</button>
              </div>
            </div>

            <!-- Category Filter -->
            <div class="col-lg-3 col-6">
              <select id="category-filter" class="form-select" onchange="triggerFilterFetch()">
                <option value="All">All Categories</option>
                <option value="Pothole">Pothole</option>
                <option value="Waste Disposal">Waste Disposal</option>
                <option value="Streetlight">Streetlight</option>
                <option value="Water Leakage">Water Leakage</option>
                <option value="Drainage">Drainage</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Priority Filter -->
            <div class="col-lg-2 col-6">
              <select id="priority-filter" class="form-select" onchange="triggerFilterFetch()">
                <option value="All">All Priorities</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>

            <!-- Sort Order -->
            <div class="col-lg-2 col-12">
              <select id="sort-filter" class="form-select" onchange="triggerFilterFetch()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="updated">Recently Updated</option>
              </select>
            </div>
          </div>

          <!-- Status Filter Pills -->
          <div class="d-flex flex-wrap align-items-center gap-2 pt-2 border-top">
            <span class="small text-muted fw-bold me-1">Status:</span>
            <button class="status-pill-btn active" data-status="All" onclick="selectStatusPill('All')">All</button>
            <button class="status-pill-btn" data-status="Pending" onclick="selectStatusPill('Pending')">Pending</button>
            <button class="status-pill-btn" data-status="Under Review" onclick="selectStatusPill('Under Review')">Under Review</button>
            <button class="status-pill-btn" data-status="Assigned" onclick="selectStatusPill('Assigned')">Assigned</button>
            <button class="status-pill-btn" data-status="In Progress" onclick="selectStatusPill('In Progress')">In Progress</button>
            <button class="status-pill-btn" data-status="Resolved" onclick="selectStatusPill('Resolved')">Resolved</button>
            <button class="status-pill-btn" data-status="Rejected" onclick="selectStatusPill('Rejected')">Rejected</button>
          </div>

        </div>
      </div>

      <!-- Complaints Grid / Table View Container -->
      <div id="complaints-container">
        <!-- Skeleton Loading State rendered via JS -->
      </div>

      <!-- Pagination Container -->
      <div id="pagination-container" class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top d-none">
        <span class="small text-muted" id="pagination-info">Showing page 1 of 1</span>
        <nav aria-label="Complaints Pagination">
          <ul class="pagination pagination-sm mb-0" id="pagination-buttons">
            <!-- Rendered by JS -->
          </ul>
        </nav>
      </div>

    </main>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let activeStatusFilter = 'All';
    let currentPage = 1;
    const pageLimit = 6;

    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireAuth(['citizen']);

      // Check URL query parameters (e.g. ?status=Resolved&category=Pothole)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('status')) activeStatusFilter = urlParams.get('status');
      if (urlParams.get('category')) document.getElementById('category-filter').value = urlParams.get('category');
      if (urlParams.get('search')) document.getElementById('search-input').value = urlParams.get('search');

      updateStatusPillUI();
      fetchMyComplaints();
    });

    function selectStatusPill(status) {
      activeStatusFilter = status;
      currentPage = 1;
      updateStatusPillUI();
      fetchMyComplaints();
    }

    function updateStatusPillUI() {
      document.querySelectorAll('.status-pill-btn').forEach(btn => {
        if (btn.getAttribute('data-status') === activeStatusFilter) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function handleSearchKeyup(e) {
      if (e.key === 'Enter') {
        triggerFilterFetch();
      }
    }

    function triggerFilterFetch() {
      currentPage = 1;
      fetchMyComplaints();
    }

    /**
     * Render Skeleton Loading State while fetching API
     */
    function renderSkeletonLoading() {
      const container = document.getElementById('complaints-container');
      const skeletonCard = `
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card-civic h-100 p-4">
            <div class="d-flex justify-content-between mb-3">
              <div class="skeleton" style="width: 100px; height: 20px;"></div>
              <div class="skeleton" style="width: 70px; height: 20px;"></div>
            </div>
            <div class="skeleton mb-2" style="width: 80%; height: 24px;"></div>
            <div class="skeleton mb-3" style="width: 100%; height: 16px;"></div>
            <div class="skeleton mb-2" style="width: 60%; height: 16px;"></div>
            <div class="d-flex justify-content-between pt-3 border-top mt-3">
              <div class="skeleton" style="width: 80px; height: 32px;"></div>
              <div class="skeleton" style="width: 100px; height: 32px;"></div>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = `<div class="row">${skeletonCard}${skeletonCard}${skeletonCard}${skeletonCard}${skeletonCard}${skeletonCard}</div>`;
    }

    /**
     * Fetch Complaints from backend API: GET /api/citizen/complaints
     */
    async function fetchMyComplaints() {
      renderSkeletonLoading();

      const searchVal = document.getElementById('search-input').value.trim();
      const categoryVal = document.getElementById('category-filter').value;
      const priorityVal = document.getElementById('priority-filter').value;
      const sortVal = document.getElementById('sort-filter').value;

      const params = new URLSearchParams({
        status: activeStatusFilter,
        category: categoryVal,
        priority: priorityVal,
        search: searchVal,
        sort: sortVal,
        page: currentPage,
        limit: pageLimit
      });

      try {
        const res = await apiRequest(`/citizen/complaints?${params.toString()}`);
        if (!res.success) return;

        const container = document.getElementById('complaints-container');
        const { complaints, total, totalPages } = res;

        // Render Empty State if 0 matching complaints
        if (!complaints || complaints.length === 0) {
          container.innerHTML = `
            <div class="text-center py-5 px-3 bg-white rounded shadow-sm border">
              <div class="fs-1 text-muted mb-3"><i class="bi bi-search"></i></div>
              <h5 class="fw-bold text-dark mb-2">No complaints found matching your search criteria</h5>
              <p class="text-muted small mb-4">Try clearing your search query or selecting a different status filter.</p>
              <button class="btn btn-outline-secondary btn-sm me-2" onclick="resetAllFilters()"><i class="bi bi-x-circle me-1"></i>Reset Filters</button>
              <a href="/citizen/report" class="btn btn-civic-primary btn-sm"><i class="bi bi-plus-circle me-1"></i>Report New Issue</a>
            </div>
          `;
          document.getElementById('pagination-container').classList.add('d-none');
          return;
        }

        // Render Complaint Cards Grid
        const cardsHtml = complaints.map(c => `
          <div class="col-md-6 col-lg-4 mb-4">
            <div class="complaint-card p-4 d-flex flex-column h-100">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <a href="/citizen/complaints/${c.id}" class="fw-bold text-decoration-none text-primary fs-6">${c.complaint_number}</a>
                ${getStatusBadge(c.status)}
              </div>
              <h5 class="fw-bold text-dark mb-2 text-truncate" title="${c.title}">${c.title}</h5>
              <p class="text-muted small mb-3 flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                ${c.description}
              </p>

              <div class="mb-3 small">
                <div class="text-secondary mb-1">
                  <i class="bi bi-geo-alt-fill text-danger me-1"></i>${c.location_address}
                </div>
                <div class="d-flex gap-2 align-items-center mt-2">
                  <span class="badge bg-light text-dark border">${c.category}</span>
                  ${getPriorityBadge(c.priority)}
                </div>
              </div>

              <div class="border-top pt-3 mt-auto d-flex justify-content-between align-items-center small text-muted">
                <div>
                  <div>Created: <strong>${new Date(c.created_at).toLocaleDateString()}</strong></div>
                  <div>Updated: <strong>${new Date(c.updated_at || c.created_at).toLocaleDateString()}</strong></div>
                </div>
                <a href="/citizen/complaints/${c.id}" class="btn btn-sm btn-outline-primary fw-semibold">
                  <i class="bi bi-eye-fill me-1"></i>View Details
                </a>
              </div>
            </div>
          </div>
        `).join('');

        container.innerHTML = `<div class="row">${cardsHtml}</div>`;

        // Render Pagination Controls
        renderPagination(totalPages, res.page, total);
      } catch (err) {
        document.getElementById('complaints-container').innerHTML = `
          <div class="alert alert-danger m-3">Failed to load grievances from server. Please try again.</div>
        `;
      }
    }

    /**
     * Render Pagination Controls
     */
    function renderPagination(totalPages, activePage, totalCount) {
      const pagContainer = document.getElementById('pagination-container');
      const infoEl = document.getElementById('pagination-info');
      const btnContainer = document.getElementById('pagination-buttons');

      if (totalPages <= 1) {
        pagContainer.classList.add('d-none');
        return;
      }

      pagContainer.classList.remove('d-none');
      infoEl.textContent = `Showing page ${activePage} of ${totalPages} (${totalCount} total grievances)`;

      let btns = '';
      // Previous Button
      btns += `
        <li class="page-item ${activePage === 1 ? 'disabled' : ''}">
          <button class="page-link" onclick="changePage(${activePage - 1})">Previous</button>
        </li>
      `;

      // Page Numbers
      for (let i = 1; i <= totalPages; i++) {
        btns += `
          <li class="page-item ${i === activePage ? 'active' : ''}">
            <button class="page-link" onclick="changePage(${i})">${i}</button>
          </li>
        `;
      }

      // Next Button
      btns += `
        <li class="page-item ${activePage === totalPages ? 'disabled' : ''}">
          <button class="page-link" onclick="changePage(${activePage + 1})">Next</button>
        </li>
      `;

      btnContainer.innerHTML = btns;
    }

    function changePage(page) {
      currentPage = page;
      fetchMyComplaints();
    }

    function resetAllFilters() {
      activeStatusFilter = 'All';
      document.getElementById('search-input').value = '';
      document.getElementById('category-filter').value = 'All';
      document.getElementById('priority-filter').value = 'All';
      document.getElementById('sort-filter').value = 'newest';
      currentPage = 1;
      updateStatusPillUI();
      fetchMyComplaints();
    }
  </script>
</body>
</html>
