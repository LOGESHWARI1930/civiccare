<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register Citizen Account – CivicCare</title>
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <meta name="theme-color" content="#176B87">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CivicCare">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- CivicCare Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      background-color: #F6F9FB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(23, 107, 135, 0.08);
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #176B87 0%, #0F4C5C 100%);
      color: #FFFFFF;
      padding: 2.2rem 2rem;
      text-align: center;
    }
    .password-toggle-btn {
      cursor: pointer;
      border-left: none;
      background: #FFFFFF;
    }
  </style>
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <!-- Centered Registration Container -->
  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-7">

        <div class="auth-card">
          <!-- Header -->
          <div class="auth-header">
            <div class="mb-2">
              <div class="bg-white rounded-3 px-3 py-2 d-inline-flex align-items-center shadow-sm">
                <img src="/assets/images/logo.png" alt="CivicCare" height="50">
              </div>
            </div>
            <h5 class="fw-semibold text-white-50 mb-0">Create Citizen Account</h5>
          </div>

          <!-- Body -->
          <div class="card-body p-4 p-md-5">

            <!-- Alert Box -->
            <div id="register-alert" class="alert d-none shadow-sm" role="alert"></div>

            <form id="register-form" novalidate>
              <div class="row g-3">
                
                <!-- Full Name -->
                <div class="col-md-6">
                  <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
                  </div>
                </div>

                <!-- Phone Number -->
                <div class="col-md-6">
                  <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit mobile number" required>
                  </div>
                </div>

                <!-- Email Address -->
                <div class="col-12">
                  <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="ramesh@example.com" required>
                  </div>
                </div>

                <!-- Address -->
                <div class="col-12">
                  <label for="address" class="form-label fw-semibold">Locality / Address</label>
                  <textarea id="address" name="address" class="form-control" rows="2" placeholder="Street name, Sector, Ward, City..."></textarea>
                </div>

                <!-- Password -->
                <div class="col-md-6">
                  <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-end-0" placeholder="Min. 6 characters" minlength="6" required>
                    <span class="input-group-text password-toggle-btn text-muted" onclick="togglePasswordVisibility('password', 'p-toggle-icon')">
                      <i class="bi bi-eye-slash" id="p-toggle-icon"></i>
                    </span>
                  </div>
                </div>

                <!-- Confirm Password -->
                <div class="col-md-6">
                  <label for="confirmPassword" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-key-fill"></i></span>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control border-end-0" placeholder="Re-enter password" required>
                    <span class="input-group-text password-toggle-btn text-muted" onclick="togglePasswordVisibility('confirmPassword', 'cp-toggle-icon')">
                      <i class="bi bi-eye-slash" id="cp-toggle-icon"></i>
                    </span>
                  </div>
                </div>

              </div>

              <!-- Submit Button -->
              <button type="submit" id="register-btn" class="btn btn-civic-primary w-100 py-2 fs-6 mt-4 shadow-sm">
                <i class="bi bi-check-circle me-1"></i> Register Citizen Account
              </button>
            </form>

          </div>

          <!-- Footer -->
          <div class="card-footer text-center bg-light py-3 border-top">
            <span class="text-muted small">Already have an account? </span>
            <a href="/login.html" class="fw-bold text-primary text-decoration-none">Log In</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    /**
     * Password Visibility Toggle Helper
     */
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      }
    }

    /**
     * Display Alert Box
     */
    function showAlert(msg, type = 'danger') {
      const alertBox = document.getElementById('register-alert');
      alertBox.className = `alert alert-${type} shadow-sm`;
      alertBox.innerHTML = msg;
      alertBox.classList.remove('d-none');
    }

    /**
     * Client-side Validation & Registration Handler
     */
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('register-alert');
      alertBox.classList.add('d-none');

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const address = document.getElementById('address').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const registerBtn = document.getElementById('register-btn');

      // 1. Required fields check
      if (!name || !phone || !email || !password || !confirmPassword) {
        showAlert('<i class="bi bi-exclamation-triangle-fill me-1"></i> Please fill in all required fields.');
        return;
      }

      // 2. Email format check
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showAlert('<i class="bi bi-exclamation-triangle-fill me-1"></i> Please enter a valid email address.');
        return;
      }

      // 3. Phone validation (min 10 digits)
      const cleanedPhone = phone.replace(/[\s\-\(\)\+]/g, '');
      if (!/^[0-9]{10,15}$/.test(cleanedPhone)) {
        showAlert('<i class="bi bi-exclamation-triangle-fill me-1"></i> Please enter a valid phone number (at least 10 digits).');
        return;
      }

      // 4. Password minimum length check
      if (password.length < 6) {
        showAlert('<i class="bi bi-exclamation-triangle-fill me-1"></i> Password must be at least 6 characters long.');
        return;
      }

      // 5. Confirm password match check
      if (password !== confirmPassword) {
        showAlert('<i class="bi bi-exclamation-triangle-fill me-1"></i> Password and Confirm Password do not match.');
        return;
      }

      // Show Loading State
      registerBtn.disabled = true;
      registerBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Creating Account...`;

      try {
        const res = await apiRequest('/auth/register', 'POST', {
          name,
          email,
          phone: cleanedPhone,
          address,
          password,
          confirmPassword
        });

        if (res.success) {
          Auth.setSession(res.token, res.user);
          showAlert('<i class="bi bi-check-circle-fill me-1"></i> Registration successful! Redirecting to Citizen Portal...', 'success');

          setTimeout(() => {
            window.location.href = '/citizen/dashboard';
          }, 1000);
        }
      } catch (err) {
        showAlert(`<i class="bi bi-exclamation-triangle-fill me-1"></i> ${err.message || 'Registration failed. Please try again.'}`);
        registerBtn.disabled = false;
        registerBtn.innerHTML = `<i class="bi bi-check-circle me-1"></i> Register Citizen Account`;
      }
    });
  </script>
</body>
</html>
