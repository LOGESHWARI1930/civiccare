<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Citizen Dashboard – CivicCare</title>
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <meta name="theme-color" content="#176B87">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CivicCare">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <!-- CivicCare Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Dynamic Header / Navbar -->
  <div id="navbar-container"></div>

  <div class="app-container">
    <!-- Desktop Sidebar & Mobile Navigation -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Banner / Greeting Row -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
          <h2 class="fw-extrabold mb-1" id="user-greeting">Welcome 👋</h2>
          <p class="text-muted mb-0">Track your reported civic issues, active repairs, and resolution updates</p>
        </div>
        <div class="mt-3 mt-md-0">
          <a href="/create-complaint.html" class="btn btn-civic-primary btn-lg px-4 shadow-sm fw-bold">
            <i class="bi bi-plus-circle-fill me-2"></i>+ Report New Issue
          </a>
        </div>
      </div>

      <!-- Statistics KPI Row -->
      <div class="row g-3" id="citizen-stats-cards">
        <div class="col-12 text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading statistics...</span>
          </div>
        </div>
      </div>

      <div class="row g-4 mt-1">
        <!-- Left 8 Columns: Recent Complaints Table -->
        <div class="col-lg-8" id="my-complaints">
          <div class="card-civic h-100">
            <div class="card-header d-flex justify-content-between align-items-center bg-white py-3">
              <h5 class="mb-0 fw-bold text-dark">
                <i class="bi bi-list-task me-2 text-primary"></i>Recent Complaints
              </h5>
              <a href="/create-complaint.html" class="btn btn-sm btn-outline-primary fw-semibold">
                <i class="bi bi-plus me-1"></i>Report Issue
              </a>
            </div>
            <div class="card-body p-0" id="citizen-complaints-list">
              <div class="p-5 text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted small mt-2">Fetching your grievances...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Right 4 Columns: Recent Activity Feed -->
        <div class="col-lg-4">
          <div class="card-civic h-100">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0 fw-bold text-dark">
                <i class="bi bi-activity me-2 text-info"></i>Recent Activity Feed
              </h5>
            </div>
            <div class="card-body p-0" id="recent-activity-container">
              <div class="p-4 text-center">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <p class="text-muted small mt-2">Loading updates...</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Floating Action Button for Mobile Instant Reporting -->
  <a href="/create-complaint.html" class="fab-civic shadow-lg" title="Report Grievance" aria-label="Report New Grievance">
    <i class="bi bi-plus-lg"></i>
  </a>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
