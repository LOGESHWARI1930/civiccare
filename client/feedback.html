<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Give Grievance Feedback – CivicCare</title>
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <meta name="theme-color" content="#176B87">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CivicCare">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- CivicCare Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .star-rating-picker {
      display: flex;
      gap: 0.6rem;
      font-size: 2.2rem;
      color: #CBD5E1;
      cursor: pointer;
    }
    .star-rating-picker i.selected,
    .star-rating-picker i:hover,
    .star-rating-picker i:hover ~ i {
      color: #F5A623 !important;
    }
    .resolution-option-card {
      border: 2px solid #E2E8F0;
      border-radius: 10px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #FFFFFF;
    }
    .resolution-option-card:hover {
      border-color: #176B87;
    }
    .resolution-option-card.selected {
      border-color: #176B87;
      background-color: rgba(23, 107, 135, 0.05);
    }
  </style>
</head>
<body>

  <!-- Dynamic Header / Navbar -->
  <div id="navbar-container"></div>

  <div class="app-container">
    <!-- Desktop Sidebar & Mobile Navigation -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Title Bar -->
      <div class="mb-4">
        <a id="back-to-complaint-link" href="/citizen/complaints" class="text-decoration-none fw-semibold text-secondary d-inline-block mb-2">
          <i class="bi bi-arrow-left me-1"></i> ← Back to Complaint Details
        </a>
        <h2 class="fw-extrabold mb-1">Grievance Resolution Feedback</h2>
        <p class="text-muted">Rate your satisfaction and help maintain high municipal service standards</p>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          
          <div id="feedback-card-container">
            <div class="text-center py-5">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="text-muted small mt-2">Loading grievance resolution details...</p>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let currentRating = 5;
    let selectedOption = 'Yes';
    let complaintId = null;

    document.addEventListener('DOMContentLoaded', () => {
      Auth.requireAuth(['citizen']);
      loadFeedbackPage();
    });

    /**
     * Load Complaint Resolution Summary & Feedback Form
     */
    async function loadFeedbackPage() {
      const container = document.getElementById('feedback-card-container');
      
      // Extract ID from pathname (e.g. /citizen/complaints/1/feedback) or URL search params (?id=1)
      const pathParts = window.location.pathname.split('/');
      complaintId = pathParts[pathParts.length - 2];
      
      if (!complaintId || isNaN(complaintId)) {
        const urlParams = new URLSearchParams(window.location.search);
        complaintId = urlParams.get('id');
      }

      if (!complaintId || isNaN(complaintId)) {
        container.innerHTML = `<div class="alert alert-danger">Invalid complaint ID.</div>`;
        return;
      }

      document.getElementById('back-to-complaint-link').href = `/citizen/complaints/${complaintId}`;

      try {
        const res = await fetch(`/api/complaints/${complaintId}/feedback`, {
          headers: { 'Authorization': `Bearer ${Auth.getToken()}` }
        });
        const data = await res.json();

        if (res.status === 404 || !data.success) {
          container.innerHTML = `<div class="alert alert-danger m-3">${data.message || 'Complaint not found.'}</div>`;
          return;
        }

        if (res.status === 403) {
          container.innerHTML = `<div class="alert alert-danger m-3">${data.message || 'Unauthorized access.'}</div>`;
          return;
        }

        const { complaint, feedback } = data;

        // Validation check: Only allow feedback for Resolved complaints
        if (complaint.status !== 'Resolved') {
          container.innerHTML = `
            <div class="card-civic p-4 text-center">
              <div class="fs-1 text-warning mb-2"><i class="bi bi-clock-history"></i></div>
              <h4 class="fw-bold text-dark mb-2">Complaint Status: ${complaint.status}</h4>
              <p class="text-muted mb-4">Feedback can only be submitted after complaint status becomes <strong>Resolved</strong>.</p>
              <a href="/citizen/complaints/${complaint.id}" class="btn btn-civic-primary px-4 fw-semibold">
                <i class="bi bi-geo-alt-fill me-1"></i> View Complaint Status
              </a>
            </div>
          `;
          return;
        }

        // If Feedback ALREADY Submitted, display review card
        if (feedback) {
          container.innerHTML = `
            <div class="card-civic border-success">
              <div class="card-header bg-success text-white py-3">
                <h5 class="mb-0 fw-bold"><i class="bi bi-check-circle-fill me-2"></i>Feedback Already Submitted</h5>
              </div>
              <div class="card-body p-4 text-center">
                <span class="fs-2 text-warning mb-2 d-block">${'★'.repeat(feedback.rating)}${'☆'.repeat(5 - feedback.rating)}</span>
                <span class="badge bg-secondary mb-3 fs-6">${feedback.resolution_status || 'Satisfied'}</span>
                <p class="text-secondary fs-6 leading-relaxed mb-3">${feedback.comment || 'No detailed review comment provided.'}</p>
                <small class="text-muted d-block mb-4">Submitted on ${new Date(feedback.created_at).toLocaleString()}</small>
                <a href="/citizen/complaints/${complaint.id}" class="btn btn-outline-primary px-4 fw-semibold">
                  <i class="bi bi-arrow-left me-1"></i> Back to Complaint Details
                </a>
              </div>
            </div>
          `;
          return;
        }

        // Render Resolution Summary & Interactive Feedback Form
        container.innerHTML = `
          <!-- Complaint & Resolution Summary Box -->
          <div class="card-civic mb-4 border-primary">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
              <h5 class="mb-0 fw-bold"><i class="bi bi-shield-check me-2"></i>Official Resolution Summary</h5>
              <span class="badge bg-light text-dark fw-bold">${complaint.complaint_number}</span>
            </div>
            <div class="card-body p-4">
              <h4 class="fw-bold mb-2 text-dark">${complaint.title}</h4>
              <p class="text-secondary small mb-3"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${complaint.location_address}</p>
              
              <div class="p-3 bg-light rounded border mb-3">
                <strong class="text-dark d-block mb-1">Official Officer Resolution Notes:</strong>
                <p class="text-secondary small mb-0">${complaint.resolution_description || 'Resolution repair completed by department team.'}</p>
              </div>

              ${complaint.resolution_evidence_url ? `
                <div class="mt-3">
                  <strong class="small text-muted d-block mb-2">Resolution Evidence Photo:</strong>
                  <img src="${complaint.resolution_evidence_url}" class="img-fluid rounded border shadow-sm" style="max-height: 260px;" alt="Evidence">
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Feedback Form Card -->
          <div class="card-civic shadow-sm">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-star-fill text-warning me-2"></i>Submit Your Service Feedback</h5>
            </div>
            <div class="card-body p-4">
              
              <form id="feedback-submit-form">
                <!-- 1 to 5 Star Rating Picker -->
                <div class="mb-4">
                  <label class="form-label fw-bold">1. How satisfied are you with the repair work? <span class="text-danger">*</span></label>
                  <div class="star-rating-picker my-2" id="star-picker-container">
                    <i class="bi bi-star-fill selected" data-value="1"></i>
                    <i class="bi bi-star-fill selected" data-value="2"></i>
                    <i class="bi bi-star-fill selected" data-value="3"></i>
                    <i class="bi bi-star-fill selected" data-value="4"></i>
                    <i class="bi bi-star-fill selected" data-value="5"></i>
                  </div>
                  <small class="text-muted" id="rating-label-text">5 / 5 Stars - Excellent Service</small>
                </div>

                <!-- Resolution Satisfaction Question -->
                <div class="mb-4">
                  <label class="form-label fw-bold">2. Was your issue completely resolved? <span class="text-danger">*</span></label>
                  <div class="row g-3">
                    <div class="col-4">
                      <div class="resolution-option-card selected text-center" id="opt-yes" onclick="selectResolutionOption('Yes')">
                        <div class="fs-3 text-success"><i class="bi bi-check-circle-fill"></i></div>
                        <strong class="d-block text-dark mt-1">Yes</strong>
                        <small class="text-muted d-none d-md-block">Completely Fixed</small>
                      </div>
                    </div>
                    <div class="col-4">
                      <div class="resolution-option-card text-center" id="opt-partially" onclick="selectResolutionOption('Partially')">
                        <div class="fs-3 text-warning"><i class="bi bi-dash-circle-fill"></i></div>
                        <strong class="d-block text-dark mt-1">Partially</strong>
                        <small class="text-muted d-none d-md-block">Partially Resolved</small>
                      </div>
                    </div>
                    <div class="col-4">
                      <div class="resolution-option-card text-center" id="opt-no" onclick="selectResolutionOption('No')">
                        <div class="fs-3 text-danger"><i class="bi bi-x-circle-fill"></i></div>
                        <strong class="d-block text-dark mt-1">No</strong>
                        <small class="text-muted d-none d-md-block">Unsatisfied</small>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Review Comments Textarea -->
                <div class="mb-4">
                  <label for="feedback-comment" class="form-label fw-bold">3. Feedback Comments / Remarks</label>
                  <textarea id="feedback-comment" name="comment" class="form-control" rows="4" placeholder="Provide feedback regarding repair quality, officer response, or suggestions..."></textarea>
                </div>

                <!-- Submit Button -->
                <div class="d-flex justify-content-end gap-2">
                  <a href="/citizen/complaints/${complaint.id}" class="btn btn-secondary px-4">Cancel</a>
                  <button type="submit" id="submit-feedback-btn" class="btn btn-civic-primary px-5 fw-bold shadow-sm">
                    <i class="bi bi-send-fill me-1"></i> Submit Feedback
                  </button>
                </div>
              </form>

            </div>
          </div>
        `;

        // Initialize Star Picker Handler
        initStarPicker();

        // Form Submit Handler
        const form = document.getElementById('feedback-submit-form');
        form.addEventListener('submit', handleFeedbackSubmit);

      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger m-3">Failed to load feedback form.</div>`;
      }
    }

    /**
     * Interactive Star Rating Selector
     */
    function initStarPicker() {
      const stars = document.querySelectorAll('#star-picker-container i');
      const labelText = document.getElementById('rating-label-text');

      const labels = {
        1: '1 / 5 Stars - Very Poor Service',
        2: '2 / 5 Stars - Unsatisfactory',
        3: '3 / 5 Stars - Average',
        4: '4 / 5 Stars - Good Resolution',
        5: '5 / 5 Stars - Excellent Service'
      };

      stars.forEach(star => {
        star.addEventListener('click', () => {
          currentRating = parseInt(star.getAttribute('data-value'), 10);
          labelText.textContent = labels[currentRating] || `${currentRating} Stars`;
          stars.forEach((s, idx) => {
            if (idx < currentRating) {
              s.classList.add('selected');
            } else {
              s.classList.remove('selected');
            }
          });
        });
      });
    }

    /**
     * Select Resolution Option (Yes / Partially / No)
     */
    function selectResolutionOption(opt) {
      selectedOption = opt;
      document.getElementById('opt-yes').classList.remove('selected');
      document.getElementById('opt-partially').classList.remove('selected');
      document.getElementById('opt-no').classList.remove('selected');

      if (opt === 'Yes') document.getElementById('opt-yes').classList.add('selected');
      else if (opt === 'Partially') document.getElementById('opt-partially').classList.add('selected');
      else if (opt === 'No') document.getElementById('opt-no').classList.add('selected');
    }

    /**
     * Handle Feedback Form Submission
     */
    async function handleFeedbackSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-feedback-btn');
      const comment = document.getElementById('feedback-comment').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Submitting...`;

      try {
        const res = await apiRequest(`/complaints/${complaintId}/feedback`, 'POST', {
          rating: currentRating,
          resolution_status: selectedOption,
          comment
        });

        if (res.success) {
          showToast(res.message, 'success');
          setTimeout(() => {
            window.location.href = `/citizen/complaints/${complaintId}`;
          }, 1200);
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="bi bi-send-fill me-1"></i> Submit Feedback`;
        showToast(err.message || 'Failed to submit feedback.', 'danger');
      }
    }
  </script>
</body>
</html>
